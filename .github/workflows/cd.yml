name: CD Pipeline

on:
  workflow_dispatch:
    inputs:
        image_tag:
            description: 'Image tag to deploy'
            required: true
        helm_chart_version:
            description: 'Helm chart version to deploy'
            required: true

env:
  REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
  IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}
  IMAGE_TAG: ${{ github.event.inputs.image_tag }}
  HELM_CHART_NAME: ${{ secrets.HELM_CHART_NAME }}
  HELM_CHART_VERSION: ${{ github.event.inputs.helm_chart_version }}
  KUBERNETES_NAMESPACE: default

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: '3.12.0'      

    - name: Get AKS credentials
      run: |
        az aks get-credentials --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --name ${{ secrets.AKS_CLUSTER_NAME }}

    - name: Generate values file from template
      run: |
        export REGISTRY="${{ env.REGISTRY }}"
        export IMAGE_NAME="${{ env.IMAGE_NAME }}"
        export IMAGE_TAG="${{ env.IMAGE_TAG }}"
        export ACR_USERNAME="${{ secrets.ACR_USERNAME }}"
        export ACR_PASSWORD="${{ secrets.ACR_PASSWORD }}"

        export MERCADO_PAGO_NOTIFICATION_URL="${{ secrets.MERCADO_PAGO_NOTIFICATION_URL }}"

        export JWT_KEY="${{ secrets.JWT_KEY }}"
        export JWT_ISSUER="${{ secrets.JWT_ISSUER }}"
        export JWT_AUDIENCE="${{ secrets.JWT_AUDIENCE }}"

        export JWT_SECURITY_KEY="${{ secrets.JWT_SECURITY_KEY }}"

        export MERCADO_PAGO_BASE_URL="${{ secrets.MERCADO_PAGO_BASE_URL }}"
        export MERCADO_PAGO_ACCESS_TOKEN="${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}"
        export MERCADO_PAGO_USER_ID="${{ secrets.MERCADO_PAGO_USER_ID }}"
        export MERCADO_PAGO_POS_ID="${{ secrets.MERCADO_PAGO_POS_ID }}"

        # export DATABASE_CONNECTION_STRING="${{ secrets.DATABASE_CONNECTION_STRING }}"
        
        # Use envsubst to replace variables in template
        envsubst < infra/helm/techchallengefastfoodapi118fase2/values-production.template.yaml > values-production.yaml
        
        # Verify the file was created (without showing sensitive content)
        echo "Generated values file:"
        echo "- Image: $REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
        echo "- Notification URL: $MERCADO_PAGO_NOTIFICATION_URL"
        echo "- API Base URL: $MERCADO_PAGO_BASE_URL"        
        echo "- Environment variables count: $(grep -c 'name:' values-production.yaml)"

    - name: Log in to Azure Container Registry
      run: |
        helm registry login ${{ env.REGISTRY }} --username ${{ secrets.ACR_USERNAME }} --password ${{ secrets.ACR_PASSWORD }}

    - name: Deploy to Kubernetes
      run: |
        helm upgrade --install ${{ env.HELM_CHART_NAME }} \
          oci://${{ env.REGISTRY }}/helm/${{ env.HELM_CHART_NAME }} \
          --version ${{ env.HELM_CHART_VERSION }} \
          --namespace ${{ env.KUBERNETES_NAMESPACE }} \
          --create-namespace \
          --values values-production.yaml \
          --timeout=10m \

    - name: Clean up temporary files
      if: always()
      run: |
        rm -f values-production.yaml